name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'audit/**'
      - 'chore/**'
      - 'refactor/**'
      - 'docs/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-pr-title:
    name: Validate Conventional PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    name: Typecheck, Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x]

    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run TypeScript Typecheck
        run: pnpm typecheck

      - name: Build Monorepo Packages
        run: pnpm build

      - name: Install Playwright Browsers (Linux)
        if: runner.os == 'Linux'
        run: pnpm --filter @focaldom/capture-playwright exec playwright install --with-deps chromium chromium-headless-shell

      - name: Install Playwright Browsers (Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter @focaldom/capture-playwright exec playwright install chromium chromium-headless-shell

      - name: Run Vitest Unit Tests
        run: pnpm test
