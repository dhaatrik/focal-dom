name: Automated Release (Release Please)

on:
  push:
    branches:
      - main
  # Manual trigger: lets you build & upload the .exe to any existing release tag.
  # Usage: Actions → Automated Release → Run workflow → enter tag (e.g. FocalDOM-v0.1.2)
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag to attach assets to (e.g. FocalDOM-v0.1.2)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Release Please — autonomous SemVer, changelogs & release PR
  #
  # Prerequisite (one-time repo setting):
  #   Settings → Actions → General → Workflow permissions →
  #   enable "Allow GitHub Actions to create and approve pull requests"
  # ─────────────────────────────────────────────────────────────────────────
  release-please:
    name: Release Please (SemVer & Changelogs)
    runs-on: ubuntu-latest
    outputs:
      # v4 correct key: supports both component-prefixed and root keys
      release_created: ${{ steps.release.outputs['FocalDOM--release_created'] || steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs['FocalDOM--tag_name'] || steps.release.outputs.tag_name }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: Run Release Please
        uses: google-github-actions/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Build Windows installer & upload assets to GitHub Release
  # Only runs when Release Please has actually created a new release.
  # ─────────────────────────────────────────────────────────────────────────
  build-and-publish-windows:
    name: Build Windows Installer & Upload Release Assets
    needs: release-please
    # Runs when: (a) Release Please created a new release, OR (b) triggered manually via workflow_dispatch
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest

    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "0"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Core Package
        run: pnpm --filter @focaldom/core build

      - name: Build Renderer Package
        run: pnpm --filter @focaldom/renderer build

      - name: Build Studio Package
        run: pnpm --filter @focaldom/studio build

      - name: Build Extension Package
        run: pnpm --filter @focaldom/extension build

      - name: Build Desktop Package
        run: pnpm --filter @focaldom/desktop build

      - name: Package Chrome Extension (.zip)
        shell: pwsh
        run: |
          Compress-Archive `
            -Path packages/extension/dist/* `
            -DestinationPath packages/extension/dist/focaldom-chrome-extension.zip `
            -Force

      - name: Build Windows Installer (.exe) via electron-builder
        run: pnpm --filter @focaldom/desktop exec electron-builder --win

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Use manual tag input when triggered via workflow_dispatch, otherwise use Release Please output
          tag_name: ${{ github.event.inputs.tag_name || needs.release-please.outputs.tag_name }}
          files: |
            apps/desktop/dist-package/FocalDOM-Setup-*.exe
            apps/desktop/dist-package/FocalDOM-*.exe
            apps/desktop/dist-package/FocalDOM-*.zip
            packages/extension/dist/focaldom-chrome-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
