<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocalDOM Live Recorder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-title">FocalDOM</span>
      </div>
      <div id="desktop-status" class="status-pill offline">
        <span class="status-dot"></span>
        <span id="status-text">Connecting...</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="popup-body">
      <div class="timer-display">
        <span id="recording-timer">00:00</span>
      </div>

      <button id="toggle-record-btn" class="record-btn start">
        <span class="record-icon"></span>
        <span id="btn-text">Start Recording</span>
      </button>

      <p class="popup-subtext">Streams click, scroll, and hover telemetry to FocalDOM Desktop</p>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
