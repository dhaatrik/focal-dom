appId: com.focaldom.desktop
productName: FocalDOM
copyright: Copyright (c) 2026 Dhaatrik Chowdhury

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - node_modules/**/*
  - package.json
  - resources/**/*

extraResources:
  - from: resources/bin/
    to: bin/
    filter:
      - '**/*'

win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
